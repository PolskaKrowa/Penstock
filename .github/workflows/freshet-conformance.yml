# Conformance gate: build this compiler and run the Freshet-lang stress
# suite (corpus goldens, negative tests, property checks, differential
# fuzz) against it. The suite itself lives in the standards repository —
# this workflow only consumes it, so language decisions and compiler
# implementation stay separated (the three-layer rule).
#
# FRESHET_LANG_REPO points at the standards repository.
name: freshet-conformance
on:
  workflow_dispatch:
    inputs:
      freshet_lang_repo:
        description: 'Freshet-lang repository (owner/repo)'
        default: 'OWNER/Freshet-lang'
        required: true
  pull_request:
  push:
    branches: [main]

env:
  FRESHET_LANG_REPO: ${{ github.event.inputs.freshet_lang_repo || 'OWNER/Freshet-lang' }}

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Freshet-lang (tests + benchmarks)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRESHET_LANG_REPO }}
          path: Freshet-lang
      - name: Build Penstock
        run: |
          set -e
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Regression suite (tests/run.sh)
        run: |
          set -e
          PEN=$(ls build/bin/penstock 2>/dev/null || echo bin/penstock)
          PEN="$(pwd)/$PEN" ./tests/run.sh
      - name: Freshet-lang conformance suite
        run: |
          set -e
          PEN=$(ls build/bin/penstock 2>/dev/null || echo bin/penstock)
          cd Freshet-lang
          FSHC="../$PEN" FUZZ_SEEDS=64 tests/run_suite.sh
      - name: Benchmark smoke (checksum gate across languages)
        run: |
          set -e
          PEN=$(ls build/bin/penstock 2>/dev/null || echo bin/penstock)
          python3 Freshet-lang/benchmarks/bench.py \
            --penstock "$(pwd)/$PEN" --reps 3 \
            --kernels dot,axpy,matmul,stencil,sumreduce,prng_bits,statemachine,calls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-logs
          path: |
            build/Testing/
            /tmp/freshet-lang-bench/
          if-no-files-found: ignore
